<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B1F" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B1B1F" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- comet trail -->
  <path d="M60 78 L292 214 L262 262 Z" fill="url(#trail)"/>
  <path d="M110 40 L318 198 L292 232 Z" fill="url(#trail)" opacity="0.55"/>
  <!-- isometric block -->
  <g stroke="#1B1B1F" stroke-width="14" stroke-linejoin="round">
    <path d="M256 190 L388 266 L256 342 L124 266 Z" fill="#D2E8FF"/>
    <path d="M124 266 L256 342 L256 478 L124 402 Z" fill="#1B1B1F"/>
    <path d="M388 266 L256 342 L256 478 L388 402 Z" fill="#3A3A42"/>
  </g>
  <!-- pixel details on the top face -->
  <g fill="#64B5F6">
    <path d="M256 224 L284 240 L256 256 L228 240 Z"/>
    <path d="M298 264 L326 280 L298 296 L270 280 Z"/>
    <path d="M214 264 L242 280 L214 296 L186 280 Z"/>
  </g>
  <!-- comet head -->
  <circle cx="300" cy="206" r="34" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="12"/>
  <circle cx="300" cy="206" r="14" fill="#2196F3"/>
</svg>
