name: Fetch file

# Downloads a file from a (public-link) Google Drive URL into a DRAFT release, so it is not publicly visible,
# and prints what it is. Nothing from the file is executed.
on:
  push:
    branches: [fetch-tool]
  workflow_dispatch:
    inputs:
      url:
        description: "Google Drive share link"
        required: false
        default: "https://drive.google.com/file/d/1psTN2G1fWtVARVZDzPVHNWVoD8_JPk0q/view?usp=drivesdk"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          URL: ${{ inputs.url || 'https://drive.google.com/file/d/1psTN2G1fWtVARVZDzPVHNWVoD8_JPk0q/view?usp=drivesdk' }}
        run: |
          set +e
          ID=$(printf '%s' "$URL" | sed -n 's#.*/d/\([A-Za-z0-9_-]*\).*#\1#p; s#.*[?&]id=\([A-Za-z0-9_-]*\).*#\1#p' | head -n1)
          echo "drive id: ${ID:0:6}..."
          curl -sS -L -o upload.bin -w "http %{http_code}, %{size_download} bytes, type %{content_type}\n" \
            "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" 2>&1 | tee /tmp/curl.txt
          if head -c 300 upload.bin | grep -qi "<html"; then
            T=$(grep -o -i '<title>[^<]*</title>' upload.bin | head -n1 | sed 's/<[^>]*>//g')
            B=$(sed 's/<style[^>]*>.*<\/style>//g; s/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' upload.bin | tr -s ' \n\t' ' ' | grep -o -i -E "(sign in|quota|too many users|can.t scan|permission|request access|not found|virus)[^.]{0,120}" | head -n3 | tr '\n' ';')
            msg="title=[$T] hints=[$B] http=$(cat /tmp/curl.txt | head -n1)"
            echo "::error title=Drive returned a web page, not the file::$msg"
            exit 1
          fi
          ls -l upload.bin
          file upload.bin
          sha256sum upload.bin

      - name: Inspect (no execution)
        run: |
          set +e
          echo "== type"; file upload.bin
          if unzip -tq upload.bin >/dev/null 2>&1; then
            echo "== zip listing (first 60)"; unzip -l upload.bin | head -n 60
            if unzip -l upload.bin | grep -q AndroidManifest.xml; then
              echo "== android package info"
              AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -n1)
              [ -n "$AAPT" ] && "$AAPT" dump badging upload.bin 2>&1 | grep -E "^package|application-label:|sdkVersion|native-code|launchable" | head -n 12
            fi
          fi
          true

      - name: Publish as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release delete uploaded-file --yes --cleanup-tag || true
          gh release create uploaded-file upload.bin --draft --title "Uploaded file (draft)" --notes "Fetched from Drive. Draft = not public."
